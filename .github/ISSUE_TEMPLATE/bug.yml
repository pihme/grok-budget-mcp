name: Bug report
description: Something in grok-budget-mcp does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the open issues first; the website's Current status lists known gaps.
        **Never paste your `auth.json`, a token or an `Authorization` header.** If the billing endpoint itself seems to have changed (new fields, new error, `SHAPE_CHANGED`), use the *Endpoint or login change* form instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` in `package.json`, or the commit you built.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - get_budget
        - get_monthly_credits
        - both
        - startup / wiring (no tool call)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How the server is wired (`grok mcp add …` or `config.toml` excerpt) and what you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "The tool result or error code (for example `Error [SESSION_EXPIRED] …`). Remove anything personal."
      render: text
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node.js version (`node --version`), Grok CLI version, whether `GROK_HOME` or `GROK_CLI_CHAT_PROXY_BASE_URL` is set.
      placeholder: macOS 15, Node 22.x, grok 0.x, GROK_HOME unset
