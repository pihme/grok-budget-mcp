name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main: it may be cutting a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Scan pull requests and main only, and only when the secret exists.
      # Dependabot and fork PRs get no secret; Dependabot is also skipped explicitly.
      RUN_SONAR: ${{ secrets.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            flake: ./nix/reference-env
          - node: 24
            flake: ./nix/node-24
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the full history for blame and new-code detection.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: bash .github/scripts/load-nix-env.sh ${{ matrix.flake }}
      - run: npm ci
      - run: npm run build
      # Node 24 runs the same tests with coverage (lcov.info) for SonarQube Cloud.
      - run: npm run ${{ matrix.node == 24 && 'test:coverage' || 'test' }}
      - name: SonarQube Cloud scan
        if: matrix.node == 24 && env.RUN_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    needs: test
    # release commits are pushed with GITHUB_TOKEN (no new run) and carry [skip ci]; the
    # message check is a third guard against loops
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: cachix/install-nix-action@v31
      - run: bash .github/scripts/load-nix-env.sh ./nix/reference-env
      - name: Tag, bump package.json and attach the npm pack tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py
