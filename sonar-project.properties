# SonarQube Cloud analysis, run from the Node 24 `test` job in .github/workflows/ci.yml.
sonar.organization=pihme
sonar.projectKey=pihme_grok-budget-mcp
sonar.projectName=grok-budget-mcp

sonar.sources=src,scripts
sonar.tests=test
sonar.test.exclusions=test/fixtures/**
sonar.sourceEncoding=UTF-8

# Written by `npm run test:coverage` (Node's built-in test coverage, mapped to src/*.ts).
sonar.javascript.lcov.reportPaths=lcov.info
sonar.coverage.exclusions=scripts/**
